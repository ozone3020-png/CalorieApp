name = "calorie-analyzer"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Workers AI binding: no API key needed, runs on Cloudflare's free daily allowance.
[ai]
binding = "AI"

# Per-device rate limit (Cloudflare's rate limiting binding; free plan). Period must be 10 or 60 seconds.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Cloud sync storage (free D1). Schema: schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "calorie-sync"
database_id = "22d22a24-0889-406a-8136-03c97c7e9767"

[vars]
# Open-weight vision model. Alternatives on Workers AI:
#   @cf/mistralai/mistral-small-3.1-24b-instruct
#   @cf/google/gemma-3-12b-it
MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# Google Gemini (free API tier). Needs the GEMINI_API_KEY secret. Comma-separated, tried in order when a model
# is retired (404) or overloaded (503). Chosen 10 Nov 2026: 3.5-flash answered in 2-7 s; 3.7/3.8-flash were
# timing out on the free tier. Google retires models for new keys, so check the error text if Gemini stops working.
GEMINI_MODEL = "gemini-3.5-flash,gemini-3.8-flash"
